# BrickPlan — frontend static assets + backend SSR/API reverse proxy.
# Static files (assets, robots.txt, llms.txt, preset avatars) are served by nginx;
# everything else (/, /detail/:id, /explore, /tags/:name, /user/:id, ...) is proxied
# to the Go backend which returns server-rendered HTML for SEO/GEO.
server {
    listen 8310;
    server_name _;

    root /home/ubuntu/project/brickplans/frontend/dist;
    index index.html;

    # Gzip (nginx handles text/html by default; don't list it here - pitfall #58)
    gzip on;
    # text/html is compressed by nginx by default - do not add it here (duplicate
    # MIME type warning). application/xml + text/xml matter: /sitemap.xml is
    # served as application/xml and was going out UNCOMPRESSED at ~484 KB.
    gzip_types text/css application/javascript application/json text/plain application/xml text/xml image/svg+xml;
    gzip_min_length 512;

    # Security headers (HSTS requires HTTPS terminated at this layer).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # Cache hashed static assets (vite emits /assets/index-<hash>.{js,css}).
    # NOTE: nginx drops server-level add_header when a location has its own
    # add_header (pitfall #54). Repeat all security headers here.
    #
    # `^~` is REQUIRED, not cosmetic: regex locations outrank plain prefix
    # locations, so the `\.(css|js|...)$` block below was winning for
    # /assets/index-<hash>.js — the 1-year immutable cache never applied and
    # returning visitors re-downloaded the bundle every hour.
    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Cache-Control "public, max-age=31536000" always;
    }

    # Plain static files served by nginx (not SSR).
    location = /robots.txt { default_type text/plain; }
    location = /llms.txt { default_type text/plain; }
    location = /og-default.png { }
    # Search-engine verification files (Google Search Console HTML-file token).
    # Served from a persistent root-owned dir, NOT from frontend/dist — a
    # `npm run build` wipes dist, which is how the IndexNow key file and the
    # baidu/sogou/bytedance verification files went missing. Only files actually
    # placed in the dir are served: a request for a token we did not install
    # must 404, otherwise any third party could verify brickplan.cn in their own
    # Search Console and read our search-performance data.
    location ~ ^/google[A-Za-z0-9_-]+\.html$ { root /etc/nginx/seo-keys; default_type text/html; }
    location /avatars/ { }

    # Uploaded files → backend (local storage).
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # API → backend.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else → backend SSR (server-rendered HTML).
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
